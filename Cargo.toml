[package]
name = "codex-quota"
version = "2.0.0"
edition = "2024"
license = "MIT"
build = "build.rs"

[[bin]]
name = "CodexQuota"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
png = "0.18"

[target.'cfg(windows)'.dependencies]
slint = { version = "=1.19.0", default-features = false, features = ["std", "compat-1-18", "renderer-software", "software-renderer-systemfonts"] }
# Winit normally enables these. Our native child-window host uses Slint's public
# platform API instead, so enable SVG decoding explicitly without bringing Winit in.
i-slint-core = { version = "=1.19.0", features = ["image-decoders", "svg"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_HiDpi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security"] }

[target.'cfg(not(windows))'.dependencies]
slint = { version = "=1.19.0", default-features = false, features = ["std", "compat-1-18", "backend-winit", "renderer-software", "software-renderer-systemfonts"] }

[build-dependencies]
slint-build = "=1.19.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
